version: "3.8"

services:
  nextjs:
    image: node:20
    container_name: emenu-nextjs
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"

  tunnel:
    image: node:20
    container_name: emenu-tunnel
    depends_on:
      - nextjs
    command: >
      sh -c "npm install -g localtunnel &&
             lt --port 3000"
